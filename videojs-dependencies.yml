# Video.js 10 ships as `@videojs/html` — a custom element player. For
# script-tag (no bundler) usage, the `@videojs/cdn` package provides
# browser-ready ESM bundles with relative imports, served by the instance
# from assets/videojs/html/.
#
# Note: previous Video.js 8 plugins (quality levels, http source selector,
# markers, mobile UI, overlay, share, VR, vtt thumbnails) no longer exist
# in the Video.js 10 architecture; equivalent behavior is provided by the
# packaged skin (quality menu, storyboard hover previews, gestures, …).
"@videojs/cdn":
  version: 10.1.0
